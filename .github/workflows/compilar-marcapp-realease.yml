name: Compilar MarcApp APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  compilar:
    name: Compilar APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Comprobar Gradle Wrapper
        run: |
          test -f ./gradlew || { echo "Falta gradlew en la raiz del proyecto"; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.jar || { echo "Falta gradle/wrapper/gradle-wrapper.jar"; exit 1; }
          chmod +x ./gradlew

      - name: Compilar APK Release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Crear llave y firmar APK Release
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias marcapp -storepass 123456 -keypass 123456 -dname "CN=MarcApp, OU=UTP, O=UTP, L=Lima, ST=Lima, C=PE"
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.jks --ks-key-alias marcapp --ks-pass pass:123456 --key-pass pass:123456 --out MarcApp-release.apk app-aligned.apk

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MarcApp v1.0.${{ github.run_number }}
          body: |
            ## MarcApp v1.0.${{ github.run_number }}
            Aplicación móvil Android para el registro y control de asistencia laboral de trabajadores.
          files: MarcApp-release.apk
